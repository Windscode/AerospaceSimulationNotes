name: Capture deployed site screenshots

on:
  workflow_run:
    workflows: ["Deploy Docusaurus site to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: site-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture screenshots
        env:
          SITE_BASE_URL: https://windscode.github.io/AerospaceSimulationNotes/
        run: node scripts/capture-site-screenshots.mjs

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: aerosim-site-screenshots-${{ github.run_id }}
          path: site-screenshots
          retention-days: 30
          if-no-files-found: error

      - name: Publish latest screenshots to repository
        run: |
          rm -rf site-audit/latest
          mkdir -p site-audit/latest
          cp -R site-screenshots/* site-audit/latest/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-audit/latest
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "Update deployed site screenshots"
            git push
          fi
